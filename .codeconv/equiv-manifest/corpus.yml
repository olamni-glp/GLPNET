# Reviewed, checked-in (g1=c). Seeded once by
#   tools/equiv/corpus.py:discover_from_suites parsing
#   test/run_all_tests.sh + test/run_book_tests.sh.
# Each source is run IN PLACE under programs/ (no copy; FR-006).
#
#   suite        : unified (384) | book (141) | bonds
#   compare_mode : trace (unified+book) | outcome (bonds, FR-005)
#   tier         : strict | dynamic  (source-level only, g2=a — the
#                  authoritative per-row subsystem is derived from the
#                  converted FILE via manifest.classify, not the source)
#   kind         : file | project (a multi-module play loaded as a unit)
#
# Regenerate (then review the diff) with:
#   python -c "from codeconv.tools.equiv import corpus; corpus.write_artifacts('.')"
