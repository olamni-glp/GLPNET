[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
version_path_separator = os
sourceless = false
output_encoding = utf-8

# sqlalchemy.url is set programmatically by codeconv.cli via
# Config.set_main_option('sqlalchemy.url', <unified-bridge-URL>).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
