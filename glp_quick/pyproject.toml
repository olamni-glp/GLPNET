[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glp_quick"
version = "0.1.0"
description = "glp-quick — /GLP-Quick control-plane tool: shared-cert QUIC/HTTP-3 + WebSocket channel-link between GLP REPL endpoints (feature 036)"
requires-python = ">=3.11"
dependencies = [
  "typer",
  "cryptography",
  "prompt_toolkit",
  # feature 067 (QR provisioning): both pure-Python, no native deps.
  "segno",   # QR encode + terminal render; never writes an image file for secret payloads
  "fpdf2",   # non-secret printable hand-off page only (FR-006)
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-mock",
]

[project.scripts]
glp-quick = "glp_quick.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put both the package (src/) and the tests package (.) on sys.path so `import glp_quick`
# and `from tests._fakes import FakeHandle` both resolve without a manual PYTHONPATH.
pythonpath = ["src", "."]
