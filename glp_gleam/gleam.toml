name = "glp_gleam"
version = "0.1.0"
description = "Gleam/BEAM implementation of GLP (epic gleam-atomvm; scaffolded by feature 033, ported by 034/036/038/050/059/060). 95 modules under src/glp/ — parser, compiler, bytecode, engine, analysis, repl, mad, codec and link/transports (ZeroMQ + TCP over Erlang FFI). Measured 2026-09-02: 206/206 cross-runtime corpus parity against the Dart reference, 0 divergences, 0 excused (test/parity/run_gleam_corpus.sh). Build-independent of glp_runtime — the Dart references in src/ are provenance comments, not edges."
licences = ["Apache-2.0"]

# Runtime deps pinned to the F1-ratified shape (ranges here; exact versions in the
# committed manifest.toml). The Gleam OTP actor package is intentionally NOT a dependency:
# its proc_lib use is outside AtomVM's BEAM/OTP subset (F1 dossier §3), so the downstream
# port stays AtomVM-runnable by spawning the raw erlang way + gleam_erlang Subjects.
# (Verified absent transitively too — see manifest.toml.)
[dependencies]
gleam_stdlib = ">= 0.34.0 and < 2.0.0"
gleam_erlang = ">= 0.34.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
