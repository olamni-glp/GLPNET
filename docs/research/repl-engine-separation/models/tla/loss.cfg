\* Run 3 (VIOLATION expected — negative control): bind and ship as SEPARATE steps
\* (what an asynchronous egress would be). A snapshot can then capture a
\* bound-but-unshipped value; a crash before the ship loses it from the transport
\* while the snapshot says it was produced => committed loss. Proves
\* NoCommittedLoss is not vacuous and the synchronous ShipGround-inside-OnBind
\* design is load-bearing.
SPECIFICATION Spec
CONSTANTS
    MaxVals = 4
    MaxCrashes = 2
    AsyncShip = TRUE
    RearmAtZero = FALSE
PROPERTIES
    NoCommittedLoss
